<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>New Tab</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#09090b}
canvas{position:absolute;inset:0;width:100%;height:100%}
#clock{position:absolute;inset:0;display:none;align-items:center;justify-content:center;font:200 12vmin/1 system-ui,sans-serif;color:#fff;mix-blend-mode:difference;letter-spacing:.04em;pointer-events:none}
</style>
</head>
<body>
<div id="clock"></div>
<script>
'use strict';
/* ---------- helpers ---------- */
const rnd=(a,b)=>a+Math.random()*(b-a);
function hsl(h,s,l){ // h in degrees, s/l in 0..1 -> [r,g,b] 0..1
  h=((h%360)+360)%360;
  const k=n=>(n+h/30)%12, a=s*Math.min(l,1-l);
  const f=n=>l-a*Math.max(-1,Math.min(k(n)-3,Math.min(9-k(n),1)));
  return [f(0),f(8),f(4)];
}
function compile(gl,type,src){
  const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);
  if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))console.error(gl.getShaderInfoLog(s));
  return s;
}
function makeProgram(gl,vs,fs){
  const p=gl.createProgram();
  gl.attachShader(p,compile(gl,gl.VERTEX_SHADER,vs));
  gl.attachShader(p,compile(gl,gl.FRAGMENT_SHADER,fs));
  gl.linkProgram(p);gl.useProgram(p);
  const b=gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER,b);
  gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([1,-1,-1,-1,1,1,-1,1]),gl.STATIC_DRAW);
  return p;
}
function newCanvas(){
  const c=document.createElement('canvas');
  document.body.appendChild(c);
  return c;
}

/* ---------- dither (WebGL2) ---------- */
const DITHER_VS='#version 300 es\nprecision mediump float;\nlayout(location=0)in vec4 p;\nvoid main(){gl_Position=p;}';
const DITHER_FS=`#version 300 es
precision mediump float;

uniform float u_time;
uniform vec2 u_resolution;
uniform float u_pixelRatio;
uniform float u_originX;
uniform float u_originY;
uniform float u_worldWidth;
uniform float u_worldHeight;
uniform float u_fit;
uniform float u_scale;
uniform float u_rotation;
uniform float u_offsetX;
uniform float u_offsetY;
uniform float u_pxSize;
uniform vec4 u_colorBack;
uniform vec4 u_colorFront;
uniform float u_shape;
uniform float u_type;

out vec4 fragColor;

vec3 permute(vec3 x) { return mod(((x * 34.0) + 1.0) * x, 289.0); }
float snoise(vec2 v) {
  const vec4 C = vec4(0.211324865405187, 0.366025403784439,
    -0.577350269189626, 0.024390243902439);
  vec2 i = floor(v + dot(v, C.yy));
  vec2 x0 = v - i + dot(i, C.xx);
  vec2 i1;
  i1 = (x0.x > x0.y) ? vec2(1.0, 0.0) : vec2(0.0, 1.0);
  vec4 x12 = x0.xyxy + C.xxzz;
  x12.xy -= i1;
  i = mod(i, 289.0);
  vec3 p = permute(permute(i.y + vec3(0.0, i1.y, 1.0))
    + i.x + vec3(0.0, i1.x, 1.0));
  vec3 m = max(0.5 - vec3(dot(x0, x0), dot(x12.xy, x12.xy),
      dot(x12.zw, x12.zw)), 0.0);
  m = m * m;
  m = m * m;
  vec3 x = 2.0 * fract(p * C.www) - 1.0;
  vec3 h = abs(x) - 0.5;
  vec3 ox = floor(x + 0.5);
  vec3 a0 = x - ox;
  m *= 1.79284291400159 - 0.85373472095314 * (a0 * a0 + h * h);
  vec3 g;
  g.x = a0.x * x0.x + h.x * x0.y;
  g.yz = a0.yz * x12.xz + h.yz * x12.yw;
  return 130.0 * dot(m, g);
}

#define TWO_PI 6.28318530718
#define PI 3.14159265358979323846

float hash11(float p) {
  p = fract(p * 0.3183099) + 0.1;
  p *= p + 19.19;
  return fract(p * p);
}

float hash21(vec2 p) {
  p = fract(p * vec2(0.3183099, 0.3678794)) + 0.1;
  p += dot(p, p + 19.19);
  return fract(p.x * p.y);
}

float getSimplexNoise(vec2 uv, float t) {
  float noise = .5 * snoise(uv - vec2(0., .3 * t));
  noise += .5 * snoise(2. * uv + vec2(0., .32 * t));
  return noise;
}

const int bayer2x2[4] = int[4](0, 2, 3, 1);
const int bayer4x4[16] = int[16](
0, 8, 2, 10,
12, 4, 14, 6,
3, 11, 1, 9,
15, 7, 13, 5
);
const int bayer8x8[64] = int[64](
0, 32, 8, 40, 2, 34, 10, 42,
48, 16, 56, 24, 50, 18, 58, 26,
12, 44, 4, 36, 14, 46, 6, 38,
60, 28, 52, 20, 62, 30, 54, 22,
3, 35, 11, 43, 1, 33, 9, 41,
51, 19, 59, 27, 49, 17, 57, 25,
15, 47, 7, 39, 13, 45, 5, 37,
63, 31, 55, 23, 61, 29, 53, 21
);

float getBayerValue(vec2 uv, int size) {
  ivec2 pos = ivec2(fract(uv / float(size)) * float(size));
  int index = pos.y * size + pos.x;
  if (size == 2) {
    return float(bayer2x2[index]) / 4.0;
  } else if (size == 4) {
    return float(bayer4x4[index]) / 16.0;
  } else if (size == 8) {
    return float(bayer8x8[index]) / 64.0;
  }
  return 0.0;
}

void main() {
  float t = .5 * u_time;

  float pxSize = u_pxSize * u_pixelRatio;
  vec2 pxSizeUV = gl_FragCoord.xy - .5 * u_resolution;
  pxSizeUV /= pxSize;
  vec2 canvasPixelizedUV = (floor(pxSizeUV) + .5) * pxSize;
  vec2 normalizedUV = canvasPixelizedUV / u_resolution;

  vec2 ditheringNoiseUV = canvasPixelizedUV;
  vec2 shapeUV = normalizedUV;

  vec2 boxOrigin = vec2(.5 - u_originX, u_originY - .5);
  vec2 givenBoxSize = vec2(u_worldWidth, u_worldHeight);
  givenBoxSize = max(givenBoxSize, vec2(1.)) * u_pixelRatio;
  float r = u_rotation * PI / 180.;
  mat2 graphicRotation = mat2(cos(r), sin(r), -sin(r), cos(r));

  float patternBoxRatio = givenBoxSize.x / givenBoxSize.y;
  vec2 boxSize = vec2(
  (u_worldWidth == 0.) ? u_resolution.x : givenBoxSize.x,
  (u_worldHeight == 0.) ? u_resolution.y : givenBoxSize.y
  );

  if (u_shape > 3.5) {
    vec2 objectBoxSize = vec2(0.);
    objectBoxSize.x = min(boxSize.x, boxSize.y);
    if (u_fit == 1.) {
      objectBoxSize.x = min(u_resolution.x, u_resolution.y);
    } else if (u_fit == 2.) {
      objectBoxSize.x = max(u_resolution.x, u_resolution.y);
    }
    objectBoxSize.y = objectBoxSize.x;
    vec2 objectWorldScale = u_resolution.xy / objectBoxSize;

    shapeUV *= objectWorldScale;
    shapeUV += boxOrigin * (objectWorldScale - 1.);
    shapeUV += vec2(-u_offsetX, u_offsetY);
    shapeUV /= u_scale;
    shapeUV = graphicRotation * shapeUV;
  } else {
    vec2 patternBoxSize = vec2(0.);
    patternBoxSize.x = patternBoxRatio * min(boxSize.x / patternBoxRatio, boxSize.y);
    float patternWorldNoFitBoxWidth = patternBoxSize.x;
    if (u_fit == 1.) {
      patternBoxSize.x = patternBoxRatio * min(u_resolution.x / patternBoxRatio, u_resolution.y);
    } else if (u_fit == 2.) {
      patternBoxSize.x = patternBoxRatio * max(u_resolution.x / patternBoxRatio, u_resolution.y);
    }
    patternBoxSize.y = patternBoxSize.x / patternBoxRatio;
    vec2 patternWorldScale = u_resolution.xy / patternBoxSize;

    shapeUV += vec2(-u_offsetX, u_offsetY) / patternWorldScale;
    shapeUV += boxOrigin;
    shapeUV -= boxOrigin / patternWorldScale;
    shapeUV *= u_resolution.xy;
    shapeUV /= u_pixelRatio;
    if (u_fit > 0.) {
      shapeUV *= (patternWorldNoFitBoxWidth / patternBoxSize.x);
    }
    shapeUV /= u_scale;
    shapeUV = graphicRotation * shapeUV;
    shapeUV += boxOrigin / patternWorldScale;
    shapeUV -= boxOrigin;
    shapeUV += .5;
  }

  float shape = 0.;
  if (u_shape < 1.5) {
    shapeUV *= .001;
    shape = 0.5 + 0.5 * getSimplexNoise(shapeUV, t);
    shape = smoothstep(0.3, 0.9, shape);

  } else if (u_shape < 2.5) {
    shapeUV *= .003;
    for (float i = 1.0; i < 6.0; i++) {
      shapeUV.x += 0.6 / i * cos(i * 2.5 * shapeUV.y + t);
      shapeUV.y += 0.6 / i * cos(i * 1.5 * shapeUV.x + t);
    }
    shape = .15 / max(0.001, abs(sin(t - shapeUV.y - shapeUV.x)));
    shape = smoothstep(0.02, 1., shape);

  } else if (u_shape < 3.5) {
    shapeUV *= .05;
    float stripeIdx = floor(2. * shapeUV.x / TWO_PI);
    float rand = hash11(stripeIdx * 10.);
    rand = sign(rand - .5) * pow(.1 + abs(rand), .4);
    shape = sin(shapeUV.x) * cos(shapeUV.y - 5. * rand * t);
    shape = pow(abs(shape), 6.);

  } else if (u_shape < 4.5) {
    shapeUV *= 4.;
    float wave = cos(.5 * shapeUV.x - 2. * t) * sin(1.5 * shapeUV.x + t) * (.75 + .25 * cos(3. * t));
    shape = 1. - smoothstep(-1., 1., shapeUV.y + wave);

  } else if (u_shape < 5.5) {
    float dist = length(shapeUV);
    float waves = sin(pow(dist, 1.7) * 7. - 3. * t) * .5 + .5;
    shape = waves;

  } else if (u_shape < 6.5) {
    float l = length(shapeUV);
    float angle = 6. * atan(shapeUV.y, shapeUV.x) + 4. * t;
    float twist = 1.2;
    float offset = 1. / pow(max(l, 1e-6), twist) + angle / TWO_PI;
    float mid = smoothstep(0., 1., pow(l, twist));
    shape = mix(0., fract(offset), mid);

  } else {
    shapeUV *= 2.;
    float d = 1. - pow(length(shapeUV), 2.);
    vec3 pos = vec3(shapeUV, sqrt(max(0., d)));
    vec3 lightPos = normalize(vec3(cos(1.5 * t), .8, sin(1.25 * t)));
    shape = .5 + .5 * dot(lightPos, pos);
    shape *= step(0., d);
  }

  int type = int(floor(u_type));
  float dithering = 0.0;

  switch (type) {
    case 1: {
      dithering = step(hash21(ditheringNoiseUV), shape);
    } break;
    case 2:
    dithering = getBayerValue(pxSizeUV, 2);
    break;
    case 3:
    dithering = getBayerValue(pxSizeUV, 4);
    break;
    default :
    dithering = getBayerValue(pxSizeUV, 8);
    break;
  }

  dithering -= .5;
  float res = step(.5, shape + dithering);

  vec3 fgColor = u_colorFront.rgb * u_colorFront.a;
  float fgOpacity = u_colorFront.a;
  vec3 bgColor = u_colorBack.rgb * u_colorBack.a;
  float bgOpacity = u_colorBack.a;

  vec3 color = fgColor * res;
  float opacity = fgOpacity * res;

  color += bgColor * (1. - opacity);
  opacity += bgOpacity * (1. - opacity);

  fragColor = vec4(color, opacity);
}
`;

function runDither(shapeId){
  const c=newCanvas(), gl=c.getContext('webgl2');
  if(!gl)return false;
  const prog=makeProgram(gl,DITHER_VS,DITHER_FS);
  gl.vertexAttribPointer(0,2,gl.FLOAT,false,0,0);
  gl.enableVertexAttribArray(0);
  const u={};
  ['u_resolution','u_time','u_pixelRatio','u_originX','u_originY','u_worldWidth','u_worldHeight','u_fit','u_scale','u_rotation','u_offsetX','u_offsetY','u_pxSize','u_colorBack','u_colorFront','u_shape','u_type'].forEach(n=>u[n]=gl.getUniformLocation(prog,n));

  // random front colour: any hue, bright enough to read on black
  const rgb=hsl(rnd(0,360),rnd(.45,.9),rnd(.5,.68));
  gl.uniform1f(u.u_originX,.5);gl.uniform1f(u.u_originY,.5);
  gl.uniform1f(u.u_worldWidth,0);gl.uniform1f(u.u_worldHeight,0);
  gl.uniform1f(u.u_fit,0);gl.uniform1f(u.u_scale,.6);gl.uniform1f(u.u_rotation,0);
  gl.uniform1f(u.u_offsetX,0);gl.uniform1f(u.u_offsetY,0);
  gl.uniform1f(u.u_pxSize,2);
  gl.uniform4fv(u.u_colorBack,new Float32Array([0,0,0,1]));
  gl.uniform4fv(u.u_colorFront,new Float32Array([...rgb,1]));
  gl.uniform1f(u.u_shape,shapeId);
  gl.uniform1f(u.u_type,3); // Bayer 4x4

  const t0=Date.now(), off=rnd(0,100);
  (function render(){
    const dpr=window.devicePixelRatio||1;
    const w=Math.round(c.clientWidth*dpr), h=Math.round(c.clientHeight*dpr);
    if(c.width!==w||c.height!==h){c.width=w;c.height=h;}
    gl.viewport(0,0,c.width,c.height);
    gl.uniform1f(u.u_pixelRatio,dpr);
    gl.uniform2f(u.u_resolution,c.width,c.height);
    gl.uniform1f(u.u_time,(Date.now()-t0)/1000+off);
    gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
    requestAnimationFrame(render);
  })();
  return true;
}

/* ---------- fluid gradient (WebGL1) ---------- */
const FLUID_VS='attribute vec4 p;void main(){gl_Position=p;}';
const FLUID_FS=`
precision highp float;
uniform vec2 u_resolution;
uniform float u_time;
uniform vec2 u_mouse;
uniform float u_speed;
uniform float u_fq;
uniform float u_wp;
uniform float u_grain;
uniform vec3 u_c1;
uniform vec3 u_c2;
uniform vec3 u_c3;
uniform vec3 u_c4;
uniform vec3 u_c5;

vec3 mod289(vec3 x){return x-floor(x*(1./289.))*289.;}
vec2 mod289(vec2 x){return x-floor(x*(1./289.))*289.;}
vec3 permute(vec3 x){return mod289(((x*34.)+1.)*x);}
float snoise(vec2 v){
  const vec4 C=vec4(.211324865405187,.366025403784439,-.577350269189626,.024390243902439);
  vec2 i=floor(v+dot(v,C.yy));
  vec2 x0=v-i+dot(i,C.xx);
  vec2 i1=(x0.x>x0.y)?vec2(1.,0.):vec2(0.,1.);
  vec4 x12=x0.xyxy+C.xxzz;
  x12.xy-=i1;
  i=mod289(i);
  vec3 pv=permute(permute(i.y+vec3(0.,i1.y,1.))+i.x+vec3(0.,i1.x,1.));
  vec3 m=max(.5-vec3(dot(x0,x0),dot(x12.xy,x12.xy),dot(x12.zw,x12.zw)),0.);
  m=m*m;m=m*m;
  vec3 x=2.*fract(pv*C.www)-1.;
  vec3 h=abs(x)-.5;
  vec3 ox=floor(x+.5);
  vec3 a0=x-ox;
  m*=1.79284291400159-.85373472095314*(a0*a0+h*h);
  vec3 g;
  g.x=a0.x*x0.x+h.x*x0.y;
  g.yz=a0.yz*x12.xz+h.yz*x12.yw;
  return 130.*dot(m,g);
}

float fbm(vec2 q){
  float f=0., a=.5;
  for(int i=0;i<5;i++){ f+=a*snoise(q); q*=2.02; a*=.5; }
  return f;
}

void main(){
  vec2 st=gl_FragCoord.xy/u_resolution.xy;
  vec2 asp=st; asp.x*=u_resolution.x/u_resolution.y;
  float t=u_time*u_speed;

  vec2 m_asp=u_mouse;
  m_asp.x*=u_resolution.x/u_resolution.y;
  vec2 m_dir=asp-m_asp;
  float m_dist=length(m_dir);
  float m_influence=smoothstep(0.45,0.0,m_dist);

  vec3 cCyan=u_c1, cYellow=u_c2, cOrange=u_c3, cPurple=u_c4, cBlue=u_c5;

  vec2 q=asp*u_fq;
  q+=m_dir*m_influence*0.35;

  float flow=fbm(q+vec2(t*.3,-t*.2));
  float drape=fbm(q*1.7+vec2(flow*(1.0+u_wp*1.2),t*.15));

  float folds=sin((drape*4.0+flow*2.0)*3.14159);
  float shade=folds*0.5+0.5;
  float highlight=pow(max(folds,0.0),6.0);

  vec3 col=mix(cBlue,cPurple,clamp(flow*.5+.5,0.,1.));
  col=mix(col,cCyan,smoothstep(.2,.9,drape*.5+.5));
  col=mix(col,cOrange,smoothstep(.3,1.,shade*(1.0-asp.y)));
  col=mix(col,cYellow,highlight*0.8);

  col*=0.55+0.55*shade;
  col+=highlight*0.35;

  col+=cPurple*m_influence*0.05;

  float gr=fract(sin(dot(gl_FragCoord.xy+floor(u_time*24.),vec2(12.9898,78.233)))*43758.5453123);
  col+=(gr-.5)*u_grain;

  gl_FragColor=vec4(col,1.);
}
`;

function runFluid(){
  const c=newCanvas(), gl=c.getContext('webgl');
  if(!gl)return false;
  const prog=makeProgram(gl,FLUID_VS,FLUID_FS);
  const ap=gl.getAttribLocation(prog,'p');
  gl.vertexAttribPointer(ap,2,gl.FLOAT,false,0,0);
  gl.enableVertexAttribArray(ap);
  const U=n=>gl.getUniformLocation(prog,n);
  const ur=U('u_resolution'),ut=U('u_time'),um=U('u_mouse');

  // random palette: base hue + spread offsets, vivid but not neon
  const base=rnd(0,360);
  const offs=[0,rnd(30,70),rnd(110,150),rnd(190,230),rnd(260,310)].sort(()=>Math.random()-.5);
  ['u_c1','u_c2','u_c3','u_c4','u_c5'].forEach((n,i)=>{
    gl.uniform3fv(U(n),new Float32Array(hsl(base+offs[i]+rnd(-12,12),rnd(.6,.95),rnd(.42,.62))));
  });
  gl.uniform1f(U('u_speed'),rnd(.18,.20));
  gl.uniform1f(U('u_fq'),rnd(.6,.8));
  gl.uniform1f(U('u_wp'),rnd(.2,.26));
  gl.uniform1f(U('u_grain'),rnd(.048,.066));

  let mx=.5,my=.5,tx=.5,ty=.5;
  addEventListener('mousemove',e=>{tx=e.clientX/innerWidth;ty=1-e.clientY/innerHeight;});
  addEventListener('touchmove',e=>{if(e.touches.length){const t=e.touches[0];tx=t.clientX/innerWidth;ty=1-t.clientY/innerHeight;}},{passive:true});

  const t0=Date.now(), off=rnd(0,200);
  (function draw(){
    if(c.width!==c.clientWidth||c.height!==c.clientHeight){c.width=c.clientWidth;c.height=c.clientHeight;}
    gl.viewport(0,0,c.width,c.height);
    gl.uniform2f(ur,c.width,c.height);
    gl.uniform1f(ut,(Date.now()-t0)/1000+off);
    mx+=(tx-mx)*.08;my+=(ty-my)*.08;
    gl.uniform2f(um,mx,my);
    gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
    requestAnimationFrame(draw);
  })();
  return true;
}

const NEW_FS=`#version 300 es
precision highp float;
uniform vec2 u_res;uniform float u_time,u_dpr,u_px,u_scan;
uniform vec2 u_mouse;uniform int u_effect,u_mode;
uniform vec3 u_c1,u_c2,u_c3;
out vec4 o;
#define TAU 6.28318530718
float hash(vec2 p){p=fract(p*vec2(123.34,456.21));p+=dot(p,p+45.32);return fract(p.x*p.y);}
float vn(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);
  return mix(mix(hash(i),hash(i+vec2(1.,0.)),f.x),mix(hash(i+vec2(0.,1.)),hash(i+vec2(1.,1.)),f.x),f.y);}
float fbm(vec2 p){float s=0.,a=.5;for(int i=0;i<4;i++){s+=a*vn(p);p=p*2.03+7.1;a*=.5;}return s/.9375;}

float field(vec2 p){
  float t=u_time*.6;
  // cursor pushes the pattern away
  vec2 dm=p-u_mouse;float d=length(dm);
  p+=dm/max(d,.001)*.07*exp(-d*5.);
  float v=0.;
  if(u_effect==0){ // metaballs
    float s=0.;
    for(int i=0;i<6;i++){float fi=float(i);
      vec2 c=.38*vec2(sin(t*.7+fi*1.7),cos(t*.9+fi*2.3));
      vec2 q=p-c;s+=.012/(dot(q,q)+.001);}
    v=smoothstep(.5,1.6,s);
  }else if(u_effect==1){ // voronoi
    vec2 q=p*5.,g=floor(q),f=fract(q);float d1=8.,d2=8.;
    for(int y=-1;y<=1;y++)for(int x=-1;x<=1;x++){
      vec2 o2=vec2(float(x),float(y));
      vec2 h=vec2(hash(g+o2),hash(g+o2+17.3));h=.5+.5*sin(t+TAU*h);
      vec2 r=o2+h-f;float dd=dot(r,r);
      if(dd<d1){d2=d1;d1=dd;}else if(dd<d2)d2=dd;}
    d1=sqrt(d1);d2=sqrt(d2);
    v=clamp(d1*.8+(1.-smoothstep(0.,.1,d2-d1))*.5,0.,1.);
  }else if(u_effect==2){ // topographic contours
    float n=fbm(p*2.+vec2(t*.05,-t*.04));
    float line=smoothstep(.4,.5,abs(fract(n*9.)-.5));
    v=line*.85+n*.3;
  }else if(u_effect==3){ // tunnel
    float r=length(p),a=atan(p.y,p.x);
    v=(.5+.5*sin(.5/max(r,.01)*6.+t*3.+a*3.))*smoothstep(0.,.25,r);
  }else if(u_effect==4){ // moire
    vec2 c=.25*vec2(cos(t*.3),sin(t*.4));
    v=.5+.5*sin(length(p-c)*70.)*sin(length(p+c)*66.);
  }else if(u_effect==5){ // plasma
    v=.5+.25*(sin(p.x*8.+t)+sin(p.y*7.-t*1.3)+sin((p.x+p.y)*6.+t*.7)+sin(length(p)*9.-t));
  }else if(u_effect==6){ // kaleidoscope
    float r=length(p),a=atan(p.y,p.x),k=TAU/8.;
    a=abs(mod(a,k)-k*.5);
    vec2 q=r*vec2(cos(a),sin(a));
    v=smoothstep(.2,.8,fbm(q*5.+t*.15));
  }else if(u_effect==7){ // truchet
    vec2 g=p*7.,id=floor(g),f=fract(g);
    if(fract(hash(id)+floor(t*.25+hash(id+3.)*4.)*.37)>.5)f.x=1.-f.x;
    float dd=min(abs(length(f)-.5),abs(length(f-1.)-.5));
    v=1.-smoothstep(0.,.14,dd);
  }else if(u_effect==8){ // aurora
    float n=fbm(vec2(p.x*1.6+t*.12,t*.1));
    float band=1.-smoothstep(0.,.55,abs(p.y-(n-.5)*.7+.05));
    v=band*(.55+.45*sin(p.x*26.+n*12.+t))*(.6+.4*fbm(vec2(p.x*6.,t*.2)));
  }else if(u_effect==9){ // marble
    vec2 q=p*2.;
    for(int i=0;i<3;i++)q+=.5*vec2(fbm(q+t*.05),fbm(q.yx-t*.05));
    v=1.-abs(sin((q.x+fbm(q)*2.)*5.));
    v=v*v;
  }else if(u_effect==10){ // julia
    vec2 z=p*2.8,c=.7885*vec2(cos(t*.2),sin(t*.2));float n=0.;
    for(int k=0;k<48;k++){if(dot(z,z)>16.)break;z=vec2(z.x*z.x-z.y*z.y,2.*z.x*z.y)+c;n+=1.;}
    v=sqrt(n/48.);
  }else if(u_effect==11){ // starfield
    float s=0.;
    for(int i=0;i<3;i++){float fi=float(i);
      vec2 g=p*(8.+fi*7.)+vec2(t*.4*(fi+1.),fi*13.);
      vec2 id=floor(g),f=fract(g)-.5;
      float h=hash(id+fi);vec2 pos=(vec2(hash(id+5.),hash(id+9.))-.5)*.6;
      s+=step(.72,h)*smoothstep(.16,0.,length(f-pos))*(.5+.5*sin(t*4.+h*60.));}
    v=clamp(s,0.,1.);
  }else{ // caustics
    vec2 q=p*5.,i=q;float c=1.;
    for(int n=0;n<4;n++){float tt=t*(1.-3.5/float(n+1));
      i=q+vec2(cos(tt-i.x)+sin(tt+i.y),sin(tt-i.y)+cos(tt+i.x));
      c+=1./length(vec2(q.x/(sin(i.x+tt)/.005),q.y/(cos(i.y+tt)/.005)));}
    c/=4.;c=1.17-pow(c,1.4);v=clamp(pow(abs(c),8.),0.,1.);
  }
  return clamp(v,0.,1.);
}

const int B[16]=int[16](0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5);

void main(){
  vec2 R=u_res,fc=gl_FragCoord.xy;float S=min(R.x,R.y);
  vec3 col;
  if(u_mode==0){ // dither
    float px=u_px*u_dpr;vec2 cell=floor(fc/px);
    float v=field(((cell+.5)*px-.5*R)/S);
    ivec2 b=ivec2(mod(cell,4.));
    float thr=float(B[b.y*4+b.x])/16.-.5;
    col=mix(u_c1,u_c2,step(.5,v+thr));
  }else if(u_mode==1){ // smooth gradient
    float v=field((fc-.5*R)/S);
    col=mix(mix(u_c1,u_c3,smoothstep(0.,.5,v)),u_c2,smoothstep(.5,1.,v));
    col+=(hash(fc+u_time)-.5)*.03;
  }else{ // halftone
    float cs=u_px*u_dpr*3.5;
    mat2 rt=mat2(.7071,.7071,-.7071,.7071);
    vec2 g=rt*fc/cs,id=floor(g),f=fract(g)-.5;
    vec2 cc=transpose(rt)*((id+.5)*cs);
    float v=field((cc-.5*R)/S);
    float rad=sqrt(v)*.72;
    col=mix(u_c1,u_c2,1.-smoothstep(rad-.07,rad+.02,length(f)));
  }
  col*=1.-u_scan*(.5+.5*sin(fc.y/u_dpr*2.094));
  o=vec4(col,1.);
}`;


/* ---------- multi-effect shader (13 effects x 3 render modes) ---------- */
function runNew(eff,mode,scan){
  const c=newCanvas(), gl=c.getContext('webgl2');
  if(!gl)return false;
  const prog=makeProgram(gl,DITHER_VS,NEW_FS);
  gl.vertexAttribPointer(0,2,gl.FLOAT,false,0,0);gl.enableVertexAttribArray(0);
  const U=n=>gl.getUniformLocation(prog,n);
  // time-of-day palette: night indigo, dawn orange, day teal/blue, dusk magenta
  const HUES=[255,255,255,255,255,20,20,35,50,60,170,185,195,200,190,170,150,25,340,320,300,270,260,255];
  const H=HUES[new Date().getHours()]+rnd(-25,25);
  gl.uniform3fv(U('u_c1'),hsl(H,.5,rnd(.04,.08)));
  gl.uniform3fv(U('u_c2'),hsl(H+rnd(-20,20),rnd(.65,.9),rnd(.58,.68)));
  gl.uniform3fv(U('u_c3'),hsl(H+rnd(40,100),rnd(.7,.9),rnd(.42,.55)));
  gl.uniform1i(U('u_effect'),eff);gl.uniform1i(U('u_mode'),mode);
  gl.uniform1f(U('u_px'),mode===0?2:2.5);gl.uniform1f(U('u_scan'),scan);
  let mx=0,my=0,tx=0,ty=0;
  addEventListener('mousemove',e=>{const d=devicePixelRatio||1,S=Math.min(c.width,c.height);
    tx=(e.clientX*d-c.width/2)/S;ty=((c.height-e.clientY*d)-c.height/2)/S;});
  const t0=Date.now(),off=rnd(0,100);
  (function render(){
    const dpr=devicePixelRatio||1,w=Math.round(c.clientWidth*dpr),h=Math.round(c.clientHeight*dpr);
    if(c.width!==w||c.height!==h){c.width=w;c.height=h;}
    gl.viewport(0,0,w,h);
    mx+=(tx-mx)*.08;my+=(ty-my)*.08;
    gl.uniform2f(U('u_res'),w,h);gl.uniform1f(U('u_dpr'),dpr);
    gl.uniform1f(U('u_time'),(Date.now()-t0)/1000+off);
    gl.uniform2f(U('u_mouse'),mx,my);
    gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
    requestAnimationFrame(render);
  })();
  return true;
}

/* ---------- pick one of 21 at random ---------- */
// 0-6 dither shapes (simplex, warp, dots, sine, ripple, swirl, sphere) | 7 fluid gradient | 8-20 new effects
// (metaballs, voronoi, contours, tunnel, moire, plasma, kaleidoscope, truchet, aurora, marble, julia, starfield, caustics)
// URL options: ?s=0-7 (0 fluid, 1-7 dither) | ?e=0-12 new effect | &m=0 dither,1 smooth,2 halftone | &scan=0.15 | ?clock
const q=new URLSearchParams(location.search);
const TOTAL=21;
let pick;
if(q.has('s')){const s=parseInt(q.get('s'));pick=s===0?7:s-1;}
else if(q.has('e'))pick=8+parseInt(q.get('e'));
else{
  let last=-1;
  try{last=parseInt(localStorage.getItem('lastPick'));}catch(e){}
  do{pick=Math.floor(Math.random()*TOTAL);}while(pick===last);
  try{localStorage.setItem('lastPick',pick);}catch(e){}
}
let ok;
if(pick<7)ok=runDither(pick+1);
else if(pick===7)ok=runFluid();
else{
  const r=Math.random();
  const mode=q.has('m')?parseInt(q.get('m')):(r<.45?0:r<.8?1:2);
  const scan=q.has('scan')?parseFloat(q.get('scan')):(Math.random()<.3?rnd(.08,.18):0);
  ok=runNew(pick-8,mode,scan);
}
if(!ok)document.body.innerHTML='<p style="color:#fff;padding:2rem;font-family:sans-serif">WebGL not supported</p>';

if(q.has('clock')){
  const el=document.getElementById('clock');el.style.display='flex';
  const tick=()=>{el.textContent=new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});};
  tick();setInterval(tick,1000);
}
